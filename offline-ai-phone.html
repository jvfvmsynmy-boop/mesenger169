<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Офлайн ИИ • Телефон</title>
  <style>
    :root {
      --bg: #0b0b0f;
      --card: #14141c;
      --border: #252532;
      --text: #f0f0f5;
      --muted: #8b8b9e;
      --accent: #7c5cff;
      --accent2: #a78bfa;
      --user: #1e1b4b;
      --ai: #1a1a24;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 680px;
      margin: 0 auto;
      position: relative;
    }

    /* Header */
    header {
      padding: 14px 16px 12px;
      background: linear-gradient(180deg, #12121a 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(124, 92, 255, 0.35);
    }

    .logo h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .logo span {
      font-size: 11px;
      color: var(--muted);
      display: block;
      margin-top: 1px;
    }

    .status-badge {
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }

    .status-badge.ready { color: var(--success); border-color: rgba(34, 197, 94, 0.3); }
    .status-badge.loading { color: var(--accent2); }

    /* Progress */
    #progress-wrap {
      display: none;
      padding: 10px 16px 0;
    }

    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      border-radius: 99px;
      transition: width 0.25s ease;
    }

    #progress-text {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
      text-align: center;
    }

    /* Chat area */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 20px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .msg {
      max-width: 88%;
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: var(--radius);
      line-height: 1.45;
      font-size: 15px;
      word-break: break-word;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      margin-left: auto;
      background: linear-gradient(135deg, #312e81, #1e1b4b);
      border-bottom-right-radius: 6px;
      box-shadow: 0 2px 10px rgba(49, 46, 129, 0.3);
    }

    .msg.ai {
      background: var(--ai);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }

    .msg.system {
      max-width: 100%;
      text-align: center;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      padding: 8px;
    }

    .msg .role {
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 4px;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* Typing indicator */
    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 4px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: var(--accent2);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Input area */
    .input-area {
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 16px; /* важно для iOS — не зумит */
      resize: none;
      max-height: 120px;
      min-height: 48px;
      line-height: 1.4;
      outline: none;
      transition: border-color 0.2s;
    }

    #user-input:focus {
      border-color: var(--accent);
    }

    #user-input:disabled {
      opacity: 0.5;
    }

    #send-btn {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: white;
      font-size: 20px;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(124, 92, 255, 0.4);
      transition: transform 0.15s, opacity 0.2s;
    }

    #send-btn:active { transform: scale(0.94); }
    #send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 8px;
      padding: 0 14px 8px;
      flex-wrap: wrap;
    }

    .btn-sm {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      cursor: pointer;
    }

    .btn-sm:active { background: var(--border); }

    /* Welcome */
    .welcome {
      text-align: center;
      padding: 40px 20px 20px;
      color: var(--muted);
    }

    .welcome h2 {
      font-size: 22px;
      color: var(--text);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .welcome p {
      font-size: 14px;
      line-height: 1.5;
      max-width: 320px;
      margin: 0 auto 20px;
    }

    .examples {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .example {
      font-size: 13px;
      padding: 8px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s;
    }

    .example:active { background: var(--border); }

    /* Model select */
    select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      outline: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">
        <div class="logo-icon">🧠</div>
        <div>
          <h1>Офлайн ИИ</h1>
          <span>полностью на телефоне</span>
        </div>
      </div>
      <div id="status" class="status-badge">загрузка…</div>
    </header>

    <div id="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div id="progress-text">Скачиваю модель…</div>
    </div>

    <div class="controls" style="padding-top:10px;">
      <select id="model-select">
        <option value="HuggingFaceTB/SmolLM2-360M-Instruct">SmolLM2 360M (рекомендую)</option>
        <option value="HuggingFaceTB/SmolLM2-135M-Instruct">SmolLM2 135M (быстрее)</option>
        <option value="onnx-community/Qwen2.5-0.5B-Instruct">Qwen2.5 0.5B</option>
      </select>
      <button class="btn-sm" id="load-btn">Загрузить модель</button>
      <button class="btn-sm" id="clear-btn">Очистить чат</button>
    </div>

    <div id="chat">
      <div class="welcome" id="welcome">
        <h2>Привет 👋</h2>
        <p>
          Это мощный офлайн ИИ. Модель скачивается один раз и потом работает
          <b>без интернета</b>. Все данные остаются только на твоём телефоне.
        </p>
        <div class="examples">
          <div class="example" data-q="Привет! Кто ты?">Кто ты?</div>
          <div class="example" data-q="Напиши короткий анекдот">Анекдот</div>
          <div class="example" data-q="Как приготовить борщ?">Рецепт борща</div>
          <div class="example" data-q="Объясни квантовую физику просто">Квантовая физика</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <textarea id="user-input" rows="1" placeholder="Напиши сообщение…" disabled></textarea>
      <button id="send-btn" disabled>➤</button>
    </div>
  </div>

  <script type="module">
    import { pipeline, env, TextStreamer } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1";

    // Настройки для браузера
    env.allowLocalModels = false;
    env.useBrowserCache = true;

    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const statusEl = document.getElementById("status");
    const progressWrap = document.getElementById("progress-wrap");
    const progressFill = document.getElementById("progress-fill");
    const progressText = document.getElementById("progress-text");
    const loadBtn = document.getElementById("load-btn");
    const clearBtn = document.getElementById("clear-btn");
    const modelSelect = document.getElementById("model-select");
    const welcomeEl = document.getElementById("welcome");

    let generator = null;
    let isGenerating = false;
    let messages = [
      { role: "system", content: "Ты — умный, дружелюбный и полезный ИИ-помощник. Отвечай на русском языке, кратко и по делу. Будь полезным и немного остроумным." }
    ];

    // Авто-рост textarea
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
    });

    // Enter = отправить (Shift+Enter = новая строка)
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", sendMessage);
    loadBtn.addEventListener("click", () => loadModel());
    clearBtn.addEventListener("click", () => {
      messages = [messages[0]]; // оставляем system
      chatEl.innerHTML = "";
      chatEl.appendChild(welcomeEl);
      welcomeEl.style.display = "block";
    });

    // Примеры
    document.querySelectorAll(".example").forEach(el => {
      el.addEventListener("click", () => {
        if (!generator) return;
        inputEl.value = el.dataset.q;
        sendMessage();
      });
    });

    function setStatus(text, cls = "") {
      statusEl.textContent = text;
      statusEl.className = "status-badge " + cls;
    }

    function addMessage(role, content, isTyping = false) {
      welcomeEl.style.display = "none";
      const div = document.createElement("div");
      div.className = `msg ${role === "user" ? "user" : "ai"}`;
      
      if (isTyping) {
        div.innerHTML = `<div class="role">ИИ</div><div class="typing"><span></span><span></span><span></span></div>`;
        div.id = "typing-msg";
      } else {
        const roleLabel = role === "user" ? "Ты" : "ИИ";
        div.innerHTML = `<div class="role">${roleLabel}</div><div class="content">${escapeHtml(content)}</div>`;
      }
      
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML.replace(/\n/g, "<br>");
    }

    async function loadModel() {
      if (generator) {
        setStatus("уже загружена", "ready");
        return;
      }

      const modelId = modelSelect.value;
      loadBtn.disabled = true;
      modelSelect.disabled = true;
      setStatus("загрузка…", "loading");
      progressWrap.style.display = "block";

      try {
        // Определяем лучший backend
        let device = "wasm";
        try {
          if (navigator.gpu) {
            const adapter = await navigator.gpu.requestAdapter();
            if (adapter) device = "webgpu";
          }
        } catch (_) {}

        generator = await pipeline("text-generation", modelId, {
          dtype: "q4",
          device: device,
          progress_callback: (p) => {
            if (p.status === "progress" && p.progress) {
              const pct = Math.round(p.progress);
              progressFill.style.width = pct + "%";
              progressText.textContent = `Скачиваю модель… ${pct}%`;
            } else if (p.status === "done") {
              progressText.textContent = "Готово! Модель загружена.";
            } else if (p.status === "initiate") {
              progressText.textContent = `Загружаю: ${p.file || "файлы модели"}…`;
            }
          }
        });

        progressWrap.style.display = "none";
        setStatus("готов ✓", "ready");
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();

        // Сообщение о готовности
        const sys = document.createElement("div");
        sys.className = "msg system";
        sys.textContent = `Модель загружена (${device === "webgpu" ? "WebGPU ⚡" : "WASM"}). Можно писать!`;
        chatEl.appendChild(sys);

      } catch (err) {
        console.error(err);
        setStatus("ошибка", "");
        progressText.textContent = "Ошибка: " + (err.message || err);
        loadBtn.disabled = false;
        modelSelect.disabled = false;
        alert("Не удалось загрузить модель.\n\nПопробуй другую модель или перезагрузи страницу.\n\n" + err.message);
      }
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || !generator || isGenerating) return;

      isGenerating = true;
      inputEl.value = "";
      inputEl.style.height = "auto";
      sendBtn.disabled = true;
      inputEl.disabled = true;

      // Добавляем сообщение пользователя
      addMessage("user", text);
      messages.push({ role: "user", content: text });

      // Показываем индикатор печати
      const typingDiv = addMessage("assistant", "", true);

      try {
        const output = await generator(messages, {
          max_new_tokens: 256,
          temperature: 0.7,
          top_p: 0.9,
          do_sample: true,
          return_full_text: false
        });

        // Убираем typing
        typingDiv.remove();

        let reply = "";
        if (Array.isArray(output) && output[0]?.generated_text) {
          const last = output[0].generated_text;
          if (Array.isArray(last)) {
            reply = last[last.length - 1]?.content || last[last.length - 1] || "";
          } else if (typeof last === "string") {
            reply = last;
          } else if (last?.content) {
            reply = last.content;
          }
        }

        if (!reply) reply = "…";

        addMessage("assistant", reply);
        messages.push({ role: "assistant", content: reply });

        // Ограничиваем историю (чтобы не раздувать контекст)
        if (messages.length > 13) {
          messages = [messages[0], ...messages.slice(-12)];
        }

      } catch (err) {
        console.error(err);
        typingDiv.remove();
        addMessage("assistant", "Произошла ошибка при генерации. Попробуй ещё раз или перезагрузи модель.");
      }

      isGenerating = false;
      sendBtn.disabled = false;
      inputEl.disabled = false;
      inputEl.focus();
    }

    // Автозагрузка самой маленькой модели при старте (можно убрать)
    // loadModel();
  </script>
</body>
</html>
